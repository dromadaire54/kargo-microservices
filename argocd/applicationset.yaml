apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: online-boutique
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # One Application per microservice and per stage, all using charts/online-boutique.
  # The microservice is described in charts/online-boutique/values.yaml (`services`), the stage by env/<stage>/values.yaml.
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - service: adservice
          - service: cartservice
          - service: redis-cart
          - service: checkoutservice
          - service: currencyservice
          - service: emailservice
          - service: frontend
          - service: loadgenerator
          - service: paymentservice
          - service: productcatalogservice
          - service: recommendationservice
          - service: shippingservice
      - list:
          elements:
          - stage: dev
          - stage: prod

  template:
    metadata:
      name: online-boutique-{{.service}}-{{.stage}}
      labels:
        app.kubernetes.io/name: online-boutique
        app.kubernetes.io/instance: "{{.service}}"
        stage: "{{.stage}}"
      annotations:
        kargo.akuity.io/authorized-stage: "kargo-microservices:{{.stage}}"

    spec:
      project: default

      source:
        repoURL: https://github.com/dromadaire54/kargo-microservices.git
        # Branch rebuilt by the Kargo promotion of the stage.
        targetRevision: stage/{{.stage}}
        path: charts/online-boutique
        helm:
          releaseName: "{{.service}}"
          # Selects the microservice in the chart's `services` values.
          parameters:
            - name: name
              value: "{{.service}}"
          # Stage values: image tags written by Kargo.
          valueFiles:
            - ../../env/{{.stage}}/values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: online-boutique-{{.stage}}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

