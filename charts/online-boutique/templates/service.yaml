{{- $s := include "online-boutique.service" . | fromYaml }}
{{- if $s.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "online-boutique.selectorLabels" . | nindent 4 }}
  ports:
  - name: {{ $s.service.portName }}
    port: {{ $s.service.port | default $s.port }}
    targetPort: {{ $s.port }}
{{- if $s.externalService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.name }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    {{- include "online-boutique.selectorLabels" . | nindent 4 }}
  ports:
  - name: {{ $s.service.portName }}
    port: {{ $s.externalService.port }}
    targetPort: {{ $s.port }}
{{- end }}
{{- end }}
