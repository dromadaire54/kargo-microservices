apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-microservices
  annotations:
    kargo.akuity.io/color: green
spec:
  # Two origins: the container images and the Helm chart (git commit) are promoted independently.
  requestedFreight:
  - origin:
      kind: Warehouse
      name: online-boutique
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: online-boutique-helm
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: imageRepo
        value: us-central1-docker.pkg.dev/google-samples/microservices-demo
      - name: repoURL
        value: https://github.com/dromadaire54/kargo-microservices.git
      - name: branch
        value: stage/dev
      steps:
      # ./src: the chart and env files at the Freight commit. ./out: the stage branch the
      # Applications track, rebuilt from ./src on each promotion.
      - uses: git-clone
        config:
          repoURL: ${{ vars.repoURL }}
          checkout:
          - commit: ${{ commitFrom(vars.repoURL, warehouse("online-boutique-helm")).ID }}
            path: ./src
          - branch: ${{ vars.branch }}
            create: true
            path: ./out

      - uses: git-clear
        config:
          path: ./out

      - uses: copy
        config:
          inPath: ./src/charts
          outPath: ./out/charts
      - uses: copy
        config:
          inPath: ./src/env/dev
          outPath: ./out/env/dev

      - uses: yaml-update
        as: update-image
        config:
          path: ./out/env/dev/values.yaml
          updates:
          - key: image.tags.adservice
            value: ${{ imageFrom(vars.imageRepo + "/adservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.cartservice
            value: ${{ imageFrom(vars.imageRepo + "/cartservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.checkoutservice
            value: ${{ imageFrom(vars.imageRepo + "/checkoutservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.currencyservice
            value: ${{ imageFrom(vars.imageRepo + "/currencyservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.emailservice
            value: ${{ imageFrom(vars.imageRepo + "/emailservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.frontend
            value: ${{ imageFrom(vars.imageRepo + "/frontend", warehouse("online-boutique")).Tag }}
          - key: image.tags.loadgenerator
            value: ${{ imageFrom(vars.imageRepo + "/loadgenerator", warehouse("online-boutique")).Tag }}
          - key: image.tags.paymentservice
            value: ${{ imageFrom(vars.imageRepo + "/paymentservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.productcatalogservice
            value: ${{ imageFrom(vars.imageRepo + "/productcatalogservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.recommendationservice
            value: ${{ imageFrom(vars.imageRepo + "/recommendationservice", warehouse("online-boutique")).Tag }}
          - key: image.tags.shippingservice
            value: ${{ imageFrom(vars.imageRepo + "/shippingservice", warehouse("online-boutique")).Tag }}

      - uses: git-commit
        as: commit
        config:
          path: ./out
          message: ${{ outputs['update-image'].commitMessage }}

      - uses: git-push
        config:
          path: ./out

      - uses: argocd-update
        config:
          apps:
          - name: online-boutique-adservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-cartservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-redis-cart-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-checkoutservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-currencyservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-emailservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-frontend-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-loadgenerator-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-paymentservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-productcatalogservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-recommendationservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}
          - name: online-boutique-shippingservice-dev
            sources:
            - repoURL: ${{ vars.repoURL }}
              desiredRevision: ${{ outputs.commit.commit }}

